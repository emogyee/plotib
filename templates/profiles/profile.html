<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ profile.channel_name }}</title>
    </head>
    <body>
        <header>
            {% if profile.profile_picture %}
                <img src="{{ profile.profile_picture.url }}"
                     alt="Profile picture"
                     width="120" />
            {% endif %}
            <h1>{{ profile.channel_name }}</h1>
            <p>@{{ profile.user.username }}</p>
            <p>{{ profile.bio }}</p>
        </header>
        <section>
            <h2>Videos</h2>
            <p>This creator's videos will appear here.</p>
        </section>
    </body>
</html>
